name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  ci:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Build application
        run: npm run build

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist
            package.json
            package-lock.json
            ecosystem.config.js
          if-no-files-found: error

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download deployable artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: deploy

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy/dist,deploy/package.json,deploy/package-lock.json,deploy/ecosystem.config.js"
          target: ${{ secrets.SERVER_APP_DIR }}
          strip_components: 1

      - name: Install production dependencies and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi

            if [ -f "$HOME/.profile" ]; then
              . "$HOME/.profile"
            fi

            if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "node is not installed or not available in PATH for this SSH session"
              exit 1
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is not installed or not available in PATH for this SSH session"
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is not installed or not available in PATH for this SSH session"
              exit 1
            fi

            node --version
            npm --version
            pm2 --version

            cd "${{ secrets.SERVER_APP_DIR }}"
            mkdir -p logs
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
